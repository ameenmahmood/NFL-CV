[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-cv"
version = "0.1.0"
description = "Football video person detection and tracking baseline"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.10,<5", "PyYAML>=6,<7", "torch>=2.5,<3", "ultralytics==8.4.177", "lap>=0.5.12,<0.6"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
football-cv = "football_cv.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: opt-in local video and model test"]
